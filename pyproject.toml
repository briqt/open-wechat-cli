[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-wechat-cli"
version = "0.1.0a1"
description = "只读读取本地微信 / 企业微信历史的 CLI（当前覆盖 Windows 企业微信）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["pycryptodome>=3.18", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
owc = "open_wechat_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
