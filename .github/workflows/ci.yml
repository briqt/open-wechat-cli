name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python scripts/check_repository.py
      - run: python -m build
      - shell: bash
        run: python scripts/check_repository.py --archives dist/*
      - shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: owc --version
